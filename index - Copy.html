azkarDataEvari.forEach((zikr, index) => {

    card.className = 'zikr-card';
    
    card.innerHTML = `
        <p><strong>${zikr.arabic}</strong></p>
        <p style="color: #555; font-size: 14px;">${zikr.badini}</p>
        <button class="btn" id="btn-ev-${index}" onclick="minusCount('ev-${index}')">

        </button>

    // ٣. فەرمان و کارکرنا دوگمەیان
    function minusCount(index) {
        const countSpan = document.getElementById(`count-${index}`);
        const button = document.getElementById(`btn-${index}`);
        let currentCount = parseInt(countSpan.innerText);

        if (currentCount > 1) {
            currentCount--;
            countSpan.innerText = currentCount;
        } else {
            countSpan.innerText = "تەمام بوو ✔️";
            button.disabled = true;
        }

        // لەرین (Vibration) بۆ مۆبایلێ
        if (navigator.vibrate) navigator.vibrate(50);
    }
    function changePage(page) {
    const title = document.getElementById('main-title');
    if(page === 'speda') {
        document.getElementById('speda-page').style.display = 'block';
        document.getElementById('evari-page').style.display = 'none';
        document.getElementById('btn-speda').classList.add('active');
        document.getElementById('btn-evari').classList.remove('active');
        title.innerText = 'ئەزکارێن سپێدێ ☀️';
    } else {
        document.getElementById('speda-page').style.display = 'none';
        document.getElementById('evari-page').style.display = 'block';
        document.getElementById('btn-speda').classList.remove('active');
        document.getElementById('btn-evari').classList.add('active');
        title.innerText = 'ئەزکارێن ئێڤاری 🌙';
    }
}
